<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VNC Control</title>
<!-- Every session in vnc-sessions.json (written by vnc_control.py), each collapsible, one noVNC frame each.
     An open session puts its controls in a narrow strip on the right (the screen keeps the full height); a collapsed
     one is a single bar with its name and has no frame, so its VNC connection is closed. State is kept per browser. -->
<style>
  html, body { margin: 0; background: #000; color: #e1e1e1; font: 14px Roboto, "Segoe UI", system-ui, sans-serif; overflow-x: hidden; }
  .s { display: flex; margin-bottom: 6px; }
  .s:not(.closed)::before { content: ""; width: 30px; flex: none; }  /* left band as wide as the control strip: symmetric, noVNC's tab starts at the screen's edge */
  .s.closed { height: 32px; align-items: center; gap: 8px; padding: 0 2px; cursor: pointer; user-select: none; }
  .s.closed .side { flex-direction: row-reverse; width: auto; padding: 0; margin-left: auto; }
  .s.closed .n { writing-mode: horizontal-tb; transform: none; order: -1; margin-right: auto; }
  iframe { display: block; flex: 1; min-width: 0; border: 0; background: #000; }
  .side { width: 30px; flex: none; display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 2px; }
  .b { width: 28px; height: 28px; border-radius: 50%; background: #1c1c1c; display: grid; place-items: center; cursor: pointer; flex: none; }
  .b svg { width: 18px; height: 18px; fill: #e1e1e1; }
  .ch svg { fill: #03a9f4; width: 20px; height: 20px; transition: transform .15s; }
  .s.closed .ch svg { transform: rotate(180deg); }
  .n { writing-mode: vertical-rl; transform: rotate(180deg); font-weight: 500; white-space: nowrap; overflow: hidden;
       text-overflow: ellipsis; max-height: 60vh; color: #bdbdbd; }
  .s.closed .n { color: #e1e1e1; display: flex; align-items: center; gap: 8px; }
  .s.closed .n::before { content: ""; width: 18px; height: 18px; background: currentColor; flex: none;
    -webkit-mask: var(--mon) center/contain no-repeat; mask: var(--mon) center/contain no-repeat; }
  :root { --mon: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M21 16H3V4h18m0-2H3c-1.11 0-2 .89-2 2v12a2 2 0 0 0 2 2h7v2H8v2h8v-2h-2v-2h7a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2Z"/></svg>'); }
  .empty { padding: 24px; color: #9e9e9e; }
</style>
</head>
<body>
<div id="list"></div>
<script>
const CHEV = '<svg viewBox="0 0 24 24"><path d="M7.41 15.41 12 10.83l4.59 4.58L18 14l-6-6-6 6 1.41 1.41Z"/></svg>';
const OPEN = '<svg viewBox="0 0 24 24"><path d="M14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3m-2 16H5V5h7V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7h-2v7Z"/></svg>';
const key = t => "vnc-control-open:" + t;
const isOpen = t => { try { return localStorage.getItem(key(t)) !== "0"; } catch (e) { return true; } };
const setOpen = (t, v) => { try { localStorage.setItem(key(t), v ? "1" : "0"); } catch (e) {} };

function url(s) {
  // path is relative to this page, so it works on the LAN root and under a secret /<key>/ path alike
  let u = "vnc-control.html?autoconnect=1&resize=scale&reconnect=1&show_dot=1&path=" +
          encodeURIComponent("websockify?token=" + s.token);
  if (s.password) u += "&password=" + encodeURIComponent(s.password);
  return u;
}

function fit() {
  // one open session fills the window height (noVNC letterboxes in black); several keep their own shape and scroll
  const open = [...document.querySelectorAll(".s:not(.closed) iframe")];
  const bars = [...document.querySelectorAll(".s.closed")].reduce((a, b) => a + b.offsetHeight + 6, 0);
  for (const f of open) {
    const byWidth = f.offsetWidth * f.dataset.h / f.dataset.w;
    f.style.height = (open.length === 1 ? Math.min(byWidth, innerHeight - bars - 6) : byWidth) + "px";
  }
}

function render(sessions) {
  const list = document.getElementById("list");
  list.innerHTML = sessions.length ? "" : '<div class="empty">No VNC sessions yet: add one from Home Assistant.</div>';
  for (const s of sessions) {
    const el = document.createElement("div");
    el.className = "s" + (isOpen(s.token) ? "" : " closed");
    el.innerHTML = `<div class="side"><span class="b ch" title="Collapse / expand">${CHEV}</span>` +
                   `<a class="b op" target="_blank" title="Open in a tab">${OPEN}</a><span class="n"></span></div>`;
    el.querySelector(".n").textContent = s.name;
    const a = el.querySelector(".op"); a.href = url(s); a.onclick = e => e.stopPropagation();
    const toggle = () => { el.classList.toggle("closed"); setOpen(s.token, !el.classList.contains("closed")); show(); };
    const show = () => {
      el.querySelector("iframe")?.remove();
      if (!el.classList.contains("closed")) {
        const f = document.createElement("iframe");
        f.src = url(s); f.dataset.w = s.width; f.dataset.h = s.height; f.allow = "clipboard-read; clipboard-write";
        el.prepend(f);
      }
      fit();
    };
    el.querySelector(".ch").onclick = e => { e.stopPropagation(); toggle(); };
    el.onclick = () => { if (el.classList.contains("closed")) toggle(); };
    list.appendChild(el); show();
  }
}

let last = null;
function load() {  // re-render only when the list changes (added/removed from Home Assistant), so open frames stay connected
  fetch("vnc-sessions.json?" + Date.now(), { cache: "no-store" }).then(r => r.text()).then(t => {
    if (t !== last) { last = t; render(JSON.parse(t)); }
  }).catch(() => { if (last === null) { last = ""; render([]); } });
}
load(); setInterval(load, 5000);
addEventListener("resize", fit);
</script>
</body>
</html>
